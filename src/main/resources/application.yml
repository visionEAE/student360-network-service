spring:
  application:
    name: network-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:student360}
    username: ${NETWORK_DB_USER:network_user}
    password: ${NETWORK_DB_PASSWORD}
  flyway:
    schemas: network                # this service migrates its own schema and nothing else
    default-schema: network
    locations: classpath:db/migration
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD}

server:
  port: ${PORT:8085}                # PORT is the Cloud Run contract

management:
  endpoints:
    web:
      exposure:
        include: health,info

student360:
  service-name: network-service     # also the audience every inbound service token must carry
  clients:
    core-service:
      url: ${CORE_SERVICE_URL:http://localhost:8082}
  security:
    service-token:
      secret: ${SERVICE_TOKEN_SECRET}
      protected-paths: ["/api/**"]
  outbox:
    table: network.outbox_event
